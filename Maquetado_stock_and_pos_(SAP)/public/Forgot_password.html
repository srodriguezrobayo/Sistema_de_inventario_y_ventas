<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="assets/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/modules/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/Main.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="Inicios">
    <main id="registroExitoso">
        <div class="col-12 mb-4"><section class="hero align-items-center bg-success text-white">
            <div class="hero-inner text-center">
                <img src="assets/img/Logo_entero_SAP.png" alt="SAP" id="Logo" width="50%" height="50%">
                <h1 class="h2">Recuperar contraseña</h1>
                <p class="lead">Ingresa tu correo y, si existe una cuenta, recibirás un enlace.</p>
                <div id="resetRequestMessage" class="alert d-none" role="status" aria-live="polite"></div>
                <form id="resetRequestForm">
                    <div class="form-floating mb-3"><input class="form-control" id="resetEmail" type="email" autocomplete="email" placeholder="correo@ejemplo.com" required><label for="resetEmail">Correo electrónico</label></div>
                    <button class="btn btn-success" type="submit"><i class="fas fa-envelope"></i> Enviar enlace</button>
                </form>
                <p class="mt-4"><a href="Login.html">Volver al inicio de sesión</a></p>
            </div>
        </section></div>
    </main>
    <script src="assets/js/app/password-reset-request.js"></script>
</body>
</html>
