<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir contraseña nueva</title>
    <link rel="stylesheet" href="assets/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/modules/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/Main.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="Inicios">
    <main id="registroExitoso">
        <div class="col-12 mb-4"><section class="hero align-items-center bg-success text-white">
            <div class="hero-inner text-center">
                <img src="assets/img/Logo_entero_SAP.png" alt="SAP" id="Logo" width="50%" height="50%">
                <h1 class="h2">Definir contraseña nueva</h1>
                <div id="resetMessage" class="alert d-none" role="status" aria-live="polite"></div>
                <form id="resetPasswordForm">
                    <div class="form-floating mb-3"><input class="form-control" id="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Contraseña" required><label for="newPassword">Nueva contraseña</label></div>
                    <div class="form-floating mb-3"><input class="form-control" id="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Confirmar contraseña" required><label for="confirmPassword">Confirmar contraseña</label></div>
                    <button class="btn btn-success" type="submit">Actualizar contraseña</button>
                </form>
                <p class="mt-4"><a href="Login.html">Volver al inicio de sesión</a></p>
            </div>
        </section></div>
    </main>
    <script src="assets/js/app/password-reset.js"></script>
</body>
</html>
