            <!-- Main Content -->
            <div class="main-content">
                <section class="section" style="padding-top: 6% !important;">
                    <div class="position-relative">
                        <div class="position-absolute top-0 start-50 translate-middle-x">
                            <div class="card" style="width: 25rem;">
                                <div class="card-header">
                                    <h3 style="margin-left: 38%;">Perfil</h3>
                                </div>
                                <div class="card-body">
                                    <img src="assets/img/avatar-4.png" class="card-img-top" id="profilePhoto" alt="Foto de perfil">
                                    <br><br>
                                    <h5 class="card-title" id="profileName">Cargando perfil...</h5>
                                    <p class="card-text" id="profileEmail"></p>
                                    <p class="card-text text-break" id="profileDescription"></p>
                                    <hr>
                                    <button type="button" class="btn btn-outline-secondary" id="changePasswordButton">Actualizar
                                        contraseña</button>
                                    <button type="button" class="btn btn-outline-dark" id="editProfileButton">Actualizar perfil</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

    <dialog class="app-dialog" id="profileDialog">
        <form id="profileForm" class="app-dialog-form">
            <div class="app-dialog-header"><h2>Actualizar perfil</h2><button type="button" class="btn-close" data-dialog-close aria-label="Cerrar"></button></div>
            <label class="form-label" for="profileNameInput">Nombre</label><input class="form-control mb-3" id="profileNameInput" maxlength="100" required>
            <label class="form-label" for="profileEmailInput">Correo electrónico</label><input class="form-control mb-3" id="profileEmailInput" type="email" maxlength="500" required>
            <label class="form-label" for="profileDescriptionInput">Descripción</label><textarea class="form-control" id="profileDescriptionInput" maxlength="5000" rows="4"></textarea>
            <label class="form-label mt-3" for="profilePhotoInput">Foto de perfil (JPG, PNG o WebP; máximo 5 MB)</label><input class="form-control" id="profilePhotoInput" type="file" accept="image/jpeg,image/png,image/webp">
            <div class="app-dialog-actions"><button type="button" class="btn btn-outline-secondary" data-dialog-close>Cancelar</button><button class="btn btn-success" type="submit">Guardar</button></div>
        </form>
    </dialog>

    <dialog class="app-dialog" id="passwordDialog">
        <form id="passwordForm" class="app-dialog-form">
            <div class="app-dialog-header"><h2>Cambiar contraseña</h2><button type="button" class="btn-close" data-dialog-close aria-label="Cerrar"></button></div>
            <label class="form-label" for="currentPassword">Contraseña actual</label><input class="form-control mb-3" id="currentPassword" type="password" autocomplete="current-password" required>
            <label class="form-label" for="newPassword">Nueva contraseña</label><input class="form-control mb-3" id="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
            <label class="form-label" for="confirmNewPassword">Confirmar nueva contraseña</label><input class="form-control" id="confirmNewPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
            <div class="app-dialog-actions"><button type="button" class="btn btn-outline-secondary" data-dialog-close>Cancelar</button><button class="btn btn-success" type="submit">Actualizar</button></div>
        </form>
    </dialog>
