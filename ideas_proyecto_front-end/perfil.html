<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAP - Perfil de Usuario</title>
  
  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #0d5c63;
      --primary-hover: #083e43;
      --sidebar-bg: #224d53;
      --body-bg: #f4f6f9;
      --text-muted: #6c757d;
    }

    body {
      background-color: var(--body-bg);
      font-family: 'Nunito', 'Segoe UI', arial;
    }

    /* Top Navbar */
    .navbar-custom {
      background-color: var(--primary-color);
      min-height: 60px;
    }

    .navbar-brand img {
      height: 40px;
    }

    /* Sidebar Layout */
    .layout-wrapper {
      display: flex;
      min-height: calc(100vh - 60px);
    }

    .sidebar {
      width: 240px;
      background-color: var(--sidebar-bg);
      color: #fff;
      flex-shrink: 0;
    }

    .sidebar .menu-header {
      padding: 15px 20px 5px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: #8da2a6;
    }

    .sidebar .nav-link {
      color: #d1e0e2;
      padding: 12px 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
      transition: all 0.2s;
    }

    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
    }

    .sidebar .nav-link i {
      width: 24px;
    }

    /* Main Content Area */
    .main-content {
      flex-grow: 1;
      padding: 30px;
    }

    /* Stisla Section Styling */
    .section-header {
      background-color: #fff;
      padding: 20px 25px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.03);
      margin-bottom: 25px;
    }

    .section-header h1 {
      font-size: 20px;
      margin: 0;
      color: #34395e;
      font-weight: 700;
    }

    /* Animated Card */
    .animated-card {
      animation: fadeInUp 0.5s ease-out forwards;
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: #ffffff;
      overflow: hidden;
    }

    .animated-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    /* Profile Card Custom Styling */
    .profile-widget-header {
      background: linear-gradient(135deg, var(--primary-color), var(--sidebar-bg));
      padding: 35px 20px 25px;
    }

    .profile-widget-picture {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border: 4px solid #ffffff;
      background-color: #e9ecef;
      transition: transform 0.3s ease;
    }

    .avatar-wrapper {
      cursor: pointer;
    }

    .avatar-wrapper:hover .profile-widget-picture {
      transform: scale(1.02);
    }

    .avatar-edit-btn {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: var(--primary-color);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      transition: background 0.2s, transform 0.2s;
    }

    .avatar-edit-btn:hover {
      background: var(--primary-hover);
      transform: scale(1.1);
      color: #fff;
    }

    .profile-widget-name {
      font-size: 20px;
      font-weight: 700;
      color: #34395e;
    }

    .profile-bio p {
      line-height: 1.6;
      font-size: 14px;
    }

    .card-footer.bg-whitesmoke {
      background-color: #f9f9f9;
      border-top: 1px solid #f2f2f2;
      padding: 18px 20px;
    }

    /* Button Styling & Animations */
    .btn-round {
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-animate {
      transition: all 0.25s ease-in-out;
    }

    .btn-animate:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13, 92, 99, 0.25);
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-outline-primary {
      color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-outline-primary:hover {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive adjustment */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .main-content {
        padding: 15px;
      }
    }
  </style>
</head>

            </div>
            <div class="text-right">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Actualizar Perfil -->
  <div class="modal fade" id="modalProfile" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title font-weight-bold">Editar Información del Perfil</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="form-profile">
            <div class="form-group">
              <label>Nombre de Usuario</label>
              <input type="text" class="form-control" value="Nombre de Usuario" required>
            </div>
            <div class="form-group">
              <label>Correo Electrónico</label>
              <input type="email" class="form-control" value="user@example.com" required>
            </div>
            <div class="form-group">
              <label>Descripción / Bio</label>
              <textarea class="form-control" rows="3">Encargado de la gestión de stock, inventario y control de ventas en el sistema POS.</textarea>
            </div>
            <div class="text-right">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Actualizar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Scripts (jQuery, Popper.js, Bootstrap 4) -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Previsualizar la imagen cargada por el usuario
      const avatarInput = document.getElementById('upload-avatar');
      const avatarPreview = document.getElementById('avatar-preview');

      if (avatarInput) {
        avatarInput.addEventListener('change', function (e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              avatarPreview.src = e.target.result;
            };
            reader.readAsDataURL(file);
          }
        });
      }

      // Prevenir el envío de formularios de prueba
      document.getElementById('form-password').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Contraseña actualizada con éxito');
        $('#modalPassword').modal('hide');
      });

      document.getElementById('form-profile').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Perfil actualizado con éxito');
        $('#modalProfile').modal('hide');
      });
    });
  </script>
</body>
</html>
