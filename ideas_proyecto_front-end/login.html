<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | SAP</title>


    <!-- =====================================================
         BOOTSTRAP 5
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =====================================================
         FONT AWESOME 5
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">


    <!-- =====================================================
         CSS PROPIO
    ====================================================== -->

    <link
        rel="stylesheet"
        href="login.css">

</head>


<body>


    <!-- =====================================================
         FORMAS DECORATIVAS DEL FONDO
    ====================================================== -->

    <div class="background-shape shape-1"></div>

    <div class="background-shape shape-2"></div>

    <div class="background-shape shape-3"></div>



    <!-- =====================================================
         CONTENEDOR PRINCIPAL
    ====================================================== -->

    <main class="login-container">


        <!-- =================================================
             TARJETA LOGIN
        ================================================== -->

        <section class="login-card">


            <!-- =================================================
                 LOGO
            ================================================== -->

            <div class="brand">


                <div class="brand-icon">

                    <i class="fas fa-crown"></i>

                </div>


                <h1>SAP</h1>


                <span>
                    STOCK AND POS
                </span>


            </div>



            <!-- =================================================
                 ENCABEZADO
            ================================================== -->

            <div class="login-header">


                <span class="welcome">

                    BIENVENIDO DE NUEVO

                </span>


                <h2>

                    Iniciar sesión

                </h2>


                <p>

                    Accede para administrar tu
                    inventario y ventas.

                </p>


            </div>



            <!-- =================================================
                 FORMULARIO
            ================================================== -->

            <form id="loginForm">


                <!-- =============================================
                     CORREO ELECTRÓNICO
                ============================================== -->

                <div class="input-group-custom">


                    <i class="far fa-envelope input-icon"></i>


                    <input
                        type="email"
                        id="correo"
                        placeholder=" "
                        autocomplete="email"
                        required>


                    <label for="correo">

                        Correo electrónico

                    </label>


                </div>



                <!-- =============================================
                     CONTRASEÑA
                ============================================== -->

                <div class="input-group-custom">


                    <i class="fas fa-lock input-icon"></i>


                    <input
                        type="password"
                        id="password"
                        placeholder=" "
                        autocomplete="current-password"
                        required>


                    <label for="password">

                        Contraseña

                    </label>


                    <!-- BOTÓN MOSTRAR CONTRASEÑA -->

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Mostrar contraseña">


                        <i class="far fa-eye"></i>


                    </button>


                </div>



                <!-- =============================================
                     OPCIONES
                ============================================== -->

                <div class="login-options">


                    <label class="remember">


                        <input
                            type="checkbox"
                            id="remember">


                        <span>

                            Recordarme

                        </span>


                    </label>



                    <a href="#">

                        ¿Olvidaste tu contraseña?

                    </a>


                </div>



                <!-- =============================================
                     BOTÓN LOGIN
                ============================================== -->

                <button
                    type="submit"
                    class="btn-login"
                    id="loginButton">


                    <span id="buttonText">

                        Iniciar sesión

                    </span>


                    <i
                        class="fas fa-arrow-right"
                        id="buttonIcon">
                    </i>


                </button>



                <!-- =============================================
                     REGISTRO
                ============================================== -->

                <div class="register-link">


                    <span>

                        ¿Aún no tienes una cuenta?

                    </span>


                    <a href="#">

                        Crear cuenta

                    </a>


                </div>


            </form>



            <!-- =================================================
                 PIE DE TARJETA
            ================================================== -->

            <div class="login-footer">


                <i class="fas fa-shield-alt"></i>


                Acceso seguro a tu sistema de gestión


            </div>


        </section>


    </main>



    <!-- =====================================================
         BOOTSTRAP JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =====================================================
         JAVASCRIPT PROPIO
    ====================================================== -->

    <script src="login.js"></script>


</body>

</html>
