<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura - SAP</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Estilo mejorado para la factura tipo tarjeta moderna */
        .invoice-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.6s ease-in-out;
        }
        .invoice-card:hover {
            box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.12);
        }
        .invoice-header {
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: white;
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
            padding: 20px;
        }
        .table-invoice th, .table-invoice td {
            vertical-align: middle;
        }
        /* Animación de entrada suave */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .btn-custom-send {
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(40, 167, 69, 0.2);
            transition: all 0.3s ease;
        }
        .btn-custom-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(40, 167, 69, 0.3);
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <!-- Tarjeta de Factura -->
                <div class="card invoice-card">
                    <div class="invoice-header text-center">
                        <h4 class="mb-1 font-weight-bold">Nombre de usuario</h4>
                        <p class="mb-0 text-white-50">Numero de factura: <span class="text-white font-weight-bold">#4444</span></p>
                        <small>Fecha expedición factura: 2026/09/24</small>
                    </div>
                    
                    <div class="card-body p-4">
                        <!-- Detalle de productos en tabla moderna -->
                        <div class="table-responsive">
                            <table class="table table-borderless table-invoice">
                                <thead class="border-bottom text-muted">
                                    <tr>
                                        <th>Producto</th>
                                        <th class="text-center">Cantidad</th>
                                        <th class="text-right">Precio Unitario</th>
                                        <th class="text-right">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="border-bottom">
                                        <td class="font-weight-bold text-dark">Producto: -------</td>
                                        <td class="text-center text-muted">#####</td>
                                        <td class="text-right text-muted">$$$</td>                                         <td class="text-right font-weight-bold text-dark">$$$</td>                                     </tr>                                 </tbody>                             </table>                         </div>                          <!-- Total a pagar -->                         <div class="row mt-4 align-items-center bg-light p-3 rounded">                             <div class="col-6">                                 <h5 class="text-muted mb-0">Total a pagar:</h5>                             </div>                             <div class="col-6 text-right">                                 <h3 class="text-success font-weight-bold mb-0">$$$</h3>
                            </div>
                        </div>

                        <!-- Botón de acción -->
                        <div class="text-center mt-4">
                            <button id="btnEnviar" class="btn btn-success btn-custom-send">
                                <i class="fas fa-envelope mr-2"></i> Enviar factura
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- JS de jQuery, Bootstrap y SweetAlert2 -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.getElementById('btnEnviar').addEventListener('click', function () {
            Swal.fire({
                title: 'Enviar Factura',
                text: 'Ingrese el correo electrónico del cliente',
                input: 'email',
                inputPlaceholder: 'correo@ejemplo.com',
                showCancelButton: true,
                confirmButtonText: 'Enviar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#28a745',
                cancelButtonColor: '#6c757d',
                reverseButtons: true,
                showClass: {
                    popup: 'animate__animated animate__fadeInDown animate__faster'
                },
                hideClass: {
                    popup: 'animate__animated animate__fadeOutUp animate__faster'
                },
                inputValidator: (value) => {
                    if (!value) {
                        return '¡Por favor ingrese un correo válido!';
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Enviado!',
                        text: `La factura ha sido enviada a: ${result.value}`,
                        confirmButtonColor: '#28a745',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }
            });
        });
    </script>
</body>
</html>
